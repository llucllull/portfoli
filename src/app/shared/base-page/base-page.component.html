@if (page(); as pageData) {
  @if (hasHeroAsFirstComponent && !heroRendered()) {
    <div class="hero-loading-placeholder col-span-full" aria-hidden="true"></div>
  }

  <dynamic-renderer
    [components]="pageData.body"
    (firstComponentRendered)="markFirstComponentAsRendered()"
  ></dynamic-renderer>
}
