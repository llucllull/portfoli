@if (layout.header(); as headerComponent) {
  <div class="header-container">
    @if (isBrowser && screen.isXs()) {
      <dynamic-renderer [components]="[mobileHeader()]"> </dynamic-renderer>
    } @else {
      <dynamic-renderer [components]="[headerComponent]"> </dynamic-renderer>
    }
  </div>
}

<main class="main-grid">
  <ng-content></ng-content>
</main>

@if (layout.footer(); as footerComponent) {
  <dynamic-renderer [components]="[footerComponent]"> </dynamic-renderer>
}

@if (language.isModalOpen() || language.isModalClosing()) {
  <lib-lang-modal
    [langs]="language.modalLanguages()"
    [closing]="language.isModalClosing()"
    (close)="language.closeLanguagesModal()"
    (select)="language.selectLanguage($event)"
    (transitionend)="language.finishLanguagesModalClose($event)"
  ></lib-lang-modal>
}
