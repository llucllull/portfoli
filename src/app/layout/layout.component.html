@if (layout.header(); as headerComponent) {
  <div class="header-container">
    @if (screen.isXs()) {
      <dynamic-renderer
        [components]="[mobileHeader(headerComponent)]"
      ></dynamic-renderer>
    } @else {
      <dynamic-renderer 
        [components]="[headerComponent]"
      ></dynamic-renderer>
    }
  </div>
}

<main>
  <ng-content></ng-content>
</main>
