@if (header$ | async; as headerComponent) {
  <div class="header-container">
    @if (!screen.isXs()) {
      <dynamic-renderer [components]="[headerComponent]"></dynamic-renderer>
    }
  
    @if (screen.isXs()) {
      <dynamic-renderer [components]="[mobileHeader(headerComponent)]"></dynamic-renderer>
    }
  </div>
}

<main>
  <ng-content></ng-content>
</main>
