@if (header$ | async; as headerComponent) {
  @if (headerComponent?.props; as props) {
    <div class="header-container">
      @if (!screen.isXs()) {
        <lib-header-clear
          [logo]="props.logo"
          [logoDark]="props.logoDark"
          [lang]="props.lang"
          [navItems]="props.navItems"
          [socialItems]="props.socialItems"
          [homeLink]="props.navItems[0]"
          (langModal)="openLanguagesModal()"
        ></lib-header-clear>
      }
      @if (screen.isXs()) {
        <lib-header-mobile
          [logo]="props.logo"
          [logoDark]="props.logoDark"
          [lang]="props.lang"
          [navItems]="props.navItems"
          [socialItems]="props.socialItems"
          [homeLink]="props.navItems[0]"
          (langModal)="openLanguagesModal()"
        ></lib-header-mobile>
      }
    </div>
  }
}

<main>
  <ng-content></ng-content>
</main>
