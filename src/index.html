<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lluc Llull</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon SVG (moderno) -->
    <link rel="icon" href="assets/favicons/favicon.svg" type="image/svg+xml" />
    <!-- Favicon ICO (fallback) -->
    <link rel="icon" href="assets/favicons/favicon.ico" sizes="any" />

    <link rel="preconnect" href="https://cdn.llucllull.dev" crossorigin />

    <!-- Preload critical fonts -->
    <link

      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <link
      rel="preload"

      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

  </head>
  <style>
    @font-face {
      font-family: "amador-w01-regular";
      font-display: swap;
      src: url("/assets/fonts/amador-w01-regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "podium-soft-demibold";
      font-display: swap;
      src: url("/assets/fonts/PODIUMSoft-DemiBold.woff2") format("woff2");
    }
    @font-face {
      font-family: "ppneuemontreal-book";
      font-display: swap;
      src: url("/assets/fonts/ppneuemontreal-book.woff2") format("woff2");
    }

    @font-face {
      font-family: "Anonymous Pro";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/assets/fonts/anonymous-pro/AnonymousPro-Regular.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Anonymous Pro";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/assets/fonts/anonymous-pro/AnonymousPro-Bold.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Anonymous Pro";
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url("/assets/fonts/anonymous-pro/AnonymousPro-Italic.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Anonymous Pro";
      font-style: italic;
      font-weight: 700;
      font-display: swap;
      src: url("/assets/fonts/anonymous-pro/AnonymousPro-BoldItalic.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --font-title-home: "amador-w01-regular", sans-serif;
      /* --font-titles: "podium-soft-demibold", sans-serif; */
      --font-titles: "Anonymous Pro", monospace;
      --font-base: "ppneuemontreal-book", sans-serif;
    }
