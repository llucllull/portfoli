name: supabase-keepalive
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Edge Function (health)
        run: |
          set -e
          curl -sS "${FUNC_URL}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "apikey: ${ANON_KEY}" \
            -o /dev/null -w "%{http_code}\n"
    env:
      # usa la URL exacta que te muestra Supabase:
      FUNC_URL: "https://ujpxanmobdxrwjsndr2q.supabase.co/functions/v1/health"
      ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
